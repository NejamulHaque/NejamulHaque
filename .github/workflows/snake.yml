name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: NejamulHaque/checkout@v4 # Or native git clone if actions/checkout is also blocked

      - name: Generate Snake SVG (using forked NejamulHaque/snk)
        uses: NejamulHaque/snk@v3
        with:
          github_user_name: NejamulHaque
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVG to output branch using native Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output || git checkout output
          git rm -rf . 2>/dev/null || true
          mkdir -p dist
          git add -f dist/*.svg
          git commit -m "chore: update contribution snake SVG" || exit 0
          git push -f origin output
