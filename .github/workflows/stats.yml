name: Generate GitHub Stats Cards (self-hosted, static SVGs)

# PERMANENT FIX for broken stats/top-languages/streak cards.
#
# The old approach embedded <img> tags pointing directly at
# github-readme-stats.vercel.app and similar shared public services.
# Those are free, best-effort, third-party instances that get
# rate-limited or paused with no warning — when that happens, every
# site embedding them breaks simultaneously, with no fix on our side.
#
# This workflow instead GENERATES the cards ourselves via GitHub
# Actions, using our own GITHUB_TOKEN (so we're never sharing someone
# else's rate limit), and commits the resulting static SVGs to the
# "output" branch of this repo. The portfolio then embeds those files
# directly from raw.githubusercontent.com — a file we own, that exists
# whether or not any third-party server is up.
on:
  schedule:
    - cron: "0 4 * * *"   # once a day, 04:00 UTC (staggered from snake.yml)
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&include_all_commits=true&count_private=true&hide_border=true&bg_color=0D1117&title_color=00D9FF&icon_color=00D9FF&text_color=C9D1D9&border_radius=10"
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=github_dark&hide_border=true&bg_color=0D1117&title_color=00D9FF&text_color=C9D1D9&border_radius=10"
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats card
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/streak.svg
          theme: dark
          hide-border: true

      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: true   # don't wipe snake.yml's files on the same branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
